name: Build extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish as a release (e.g. v0.1.0). Leave empty for a plain build.
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Zip extension
        run: |
          VERSION="${TAG:-$(git rev-parse --short HEAD)}"
          mkdir -p out
          (cd extension/dist && zip -qr "$GITHUB_WORKSPACE/out/dev-tool-mcp-extension-${VERSION}.zip" .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-tool-mcp-extension
          path: extension/dist
          if-no-files-found: error

      - name: Publish GitHub release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.zip -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" out/*.zip -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          fi
