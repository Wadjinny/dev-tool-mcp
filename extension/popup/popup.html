<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dev-tool-mcp</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="pending" class="strip pending" hidden></div>

    <div id="owner-strip" class="strip" hidden>
      <span id="owner-dot" class="dot" aria-hidden="true"></span>
      <span id="owner-text" class="strip-text ell"></span>
      <button id="btn-stop" class="strip-stop" type="button">Stop</button>
    </div>

    <div class="h">
      <b>Agents</b>
      <span id="agent-count">Scanning…</span>
    </div>
    <div id="agents" class="grid"></div>

    <div class="h">
      <b id="palette-title">Commands</b>
      <button id="palette-back" class="text-btn" type="button" hidden>Back</button>
    </div>
    <div id="ctx" class="ctx"></div>
    <div id="commands" class="list" role="listbox" aria-label="Commands"></div>
    <div class="ft">
      <span id="ft-keys">↑↓ navigate · ↵ run</span>
      <span class="ft-meta">
        <span id="bridge-dot" class="dot off" aria-hidden="true"></span>
        <span id="bridge-status">…</span>
        <span id="ft-count"></span>
      </span>
    </div>

    <div id="error-panel" class="error" hidden></div>

    <details class="settings">
      <summary>Settings</summary>
      <label class="port-row">
        <span>Port</span>
        <input id="port" class="input" type="number" min="1" max="65535" />
        <button id="btn-apply-port" class="btn dark" type="button">Apply</button>
        <button id="btn-reconnect" class="btn" type="button">Reconnect</button>
        <button id="btn-refresh" class="btn" type="button">Refresh</button>
      </label>
      <p class="hint">
        Access is limited to the Connected tab and a local MCP server on
        127.0.0.1. The debugger permission is required for DevTools-depth tools.
      </p>
    </details>

    <script type="module" src="popup.js"></script>
  </body>
</html>
